# Configuração usada só pelos testes (#26). Por estar em src/test/resources, este arquivo
# substitui o application.properties de src/main/resources quando os testes rodam.
#
# H2 é um banco em memória: nasce vazio a cada execução e some no fim. MODE=PostgreSQL faz o H2
# imitar o PostgreSQL, que é o banco de verdade do projeto.
spring.application.name=sistemasalao
spring.datasource.url=jdbc:h2:mem:sistemasalao;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# create-drop: cria as tabelas a partir das entidades ao subir e apaga ao terminar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
