spring.application.name=sistemasalao
spring.datasource.url=jdbc:postgresql://localhost:5432/sistemasalao
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Login (#18). Os valores vêm de variáveis de ambiente; nada de segredo fica no código.
# JWT_SECRET: frase longa e aleatória que assina os tokens. Sem ela, o sistema sorteia uma a cada
# vez que sobe, e todo mundo precisa entrar de novo depois de reiniciar.
app.jwt.secret=${JWT_SECRET:}
# Primeiro acesso: se não existir nenhum usuário, cria o administrador com este login.
# Sem ADMIN_SENHA, a senha é sorteada e aparece uma única vez no console. Troque-a no primeiro acesso.
app.admin.login=${ADMIN_LOGIN:admin}
app.admin.senha=${ADMIN_SENHA:}

# E-mail do salão para o "esqueci minha senha" (#42). Sem MAIL_HOST, a recuperação por e-mail fica
# desligada e o link nem aparece no login. Para Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USUARIO=o e-mail
# e MAIL_SENHA=uma "senha de app" criada em myaccount.google.com/apppasswords (não a senha normal).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORTA:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_SENHA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.remetente=${MAIL_REMETENTE:}
