<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Protótipo Tesoura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de gestão — barra lateral no desktop, navegação inferior no celular; agenda em grade por profissional */
:root{
  --bg:#F5F4F7; --surface:#FFFFFF; --sunk:#EFEDF3; --ink:#1E1A27; --muted:#686277; --line:#E2DFE9;
  --accent:#A3245A; --accent-ink:#FFFFFF; --accent-soft:#F7E4EC;
  --ok:#23774F; --ok-soft:#E1F3EA; --warn:#9A6312; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE5E2;
  --p1:#2F6FB0; --p1-soft:#E3EEF9; --p2:#B4641A; --p2-soft:#FAEBDD; --p3:#2E7D6B; --p3-soft:#DFF2EC;
  --shadow:0 1px 2px rgba(30,26,39,.06),0 8px 24px rgba(30,26,39,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141219; --surface:#1D1A24; --sunk:#25212E; --ink:#EEEAF5; --muted:#A49EB2; --line:#322D3D;
  --accent:#E46A9D; --accent-ink:#1A0F15; --accent-soft:#3A1F2C;
  --ok:#5CC499; --ok-soft:#173327; --warn:#E3B15A; --warn-soft:#382A12; --bad:#F2806F; --bad-soft:#3D1B17;
  --p1:#7FB0E6; --p1-soft:#1B2A3B; --p2:#E9A15E; --p2-soft:#3A2715; --p3:#6CCBB3; --p3-soft:#163330;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141219; --surface:#1D1A24; --sunk:#25212E; --ink:#EEEAF5; --muted:#A49EB2; --line:#322D3D;
  --accent:#E46A9D; --accent-ink:#1A0F15; --accent-soft:#3A1F2C;
  --ok:#5CC499; --ok-soft:#173327; --warn:#E3B15A; --warn-soft:#382A12; --bad:#F2806F; --bad-soft:#3D1B17;
  --p1:#7FB0E6; --p1-soft:#1B2A3B; --p2:#E9A15E; --p2-soft:#3A2715; --p3:#6CCBB3; --p3-soft:#163330;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;letter-spacing:-.01em}
h2{font-size:1.1rem}
h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
small{font-size:.82rem}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* faixa do protótipo */
.proto{background:var(--ink);color:var(--bg);font-size:.8rem}
.proto .gut{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding-block:7px}
.proto b{font-weight:600}
.proto button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:2px 12px;cursor:pointer;color:var(--bg);font-size:.78rem}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.field{display:grid;gap:5px}
.field>span{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px}
.field textarea{min-height:70px;resize:vertical}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.rf{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-AGENDADO{background:var(--p1-soft);color:var(--p1)}
.st-CONCLUIDO{background:var(--ok-soft);color:var(--ok)}
.st-CANCELADO{background:var(--bad-soft);color:var(--bad)}
.st-RECEBER{background:var(--warn-soft);color:var(--warn)}
.pc{display:inline-flex;align-items:center;gap:6px;font-size:.85rem}
.pc i{width:9px;height:9px;border-radius:3px;background:var(--pc)}
.label{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* login */
.login{min-height:calc(100vh - 34px);display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;max-width:1040px;margin:0 auto;padding-block:40px}
.login-art{display:grid;gap:22px}
.login-art .brand{font-size:2.6rem}
.login-tag{font-family:var(--f-display);font-size:1.5rem;font-weight:500;max-width:22ch;line-height:1.25}
.login-points{list-style:none;padding:0;margin:0;display:grid;gap:10px;color:var(--muted)}
.login-points li{display:flex;gap:10px;align-items:baseline}
.login-points li::before{content:"";width:8px;height:8px;flex:none;border-radius:2px;background:var(--accent);transform:translateY(-1px)}
.login-form{display:grid;gap:16px;padding:28px;box-shadow:var(--shadow)}
.login-form .hint{font-size:.8rem;color:var(--muted);text-align:center}
.login-form .link{justify-self:center;font-size:.88rem}
.byline{font-size:.8rem;color:var(--muted)}
@media (max-width:820px){.login{grid-template-columns:1fr;gap:28px;padding-block:28px}.login-tag{font-size:1.2rem}}

/* shell */
.brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.brand svg{width:1.15em;height:1.15em;color:var(--accent)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 34px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - 34px);padding-left:max(14px,env(safe-area-inset-left,0px))}
.side .brand{padding:0 8px}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:grid;gap:4px;font-size:.88rem}
.main{min-width:0;padding-block:26px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:22px}
.phead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.phead .t{display:grid;gap:6px;min-width:0}
.phead .acts{display:flex;flex-wrap:wrap;gap:8px}
.crumb{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-weight:600;font-size:.88rem;justify-self:start}
.crumb:hover{color:var(--ink)}
.bnav{display:none}
.mtop{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(90px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .bnav a{display:grid;justify-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 6px;border-radius:8px;cursor:pointer;flex:1}
  .bnav a svg{width:21px;height:21px}
  .bnav a.on{color:var(--accent)}
  h1{font-size:1.45rem}
}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px 18px;display:grid;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:.8rem;color:var(--muted)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.list{display:grid}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.row:hover{background:var(--sunk)}
.row .who{display:grid;min-width:0}
.row .who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px}
.quick{display:grid;gap:8px}
.quick .btn{justify-content:flex-start}

/* agenda */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.datenav{display:inline-flex;align-items:center;gap:4px}
.datenav b{min-width:12ch;text-align:center;font-weight:600}
.datenav .btn{padding:6px 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px}
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal{display:grid;grid-template-columns:58px repeat(var(--cols),minmax(150px,1fr));min-width:fit-content}
.cal-h{position:sticky;top:0;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;background:var(--surface);font-size:.9rem}
.cal-h:not(:first-child){border-left:1px solid var(--line)}
.ruler{position:relative;height:calc(10 * var(--hp))}
.ruler span{position:absolute;right:8px;transform:translateY(-50%);font-size:.72rem;color:var(--muted)}
.ruler span:first-child{transform:none}
.col{position:relative;height:calc(10 * var(--hp));border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hp))}
.ev{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 8px;background:var(--pcs);border-left:3px solid var(--pc);cursor:pointer;overflow:hidden;text-align:left;border-top:0;border-right:0;border-bottom:0;font-size:.8rem;line-height:1.3;color:var(--ink)}
.ev:hover{filter:brightness(.97)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev.CANCELADO{opacity:.55;background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px);text-decoration:line-through}
.ev.CONCLUIDO b::after{content:" ✓";color:var(--ok)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.week{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));min-width:fit-content}
.wd{border-left:1px solid var(--line);min-height:300px;display:flex;flex-direction:column}
.wd:first-child{border-left:0}
.wd-h{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;font-size:.8rem;color:var(--muted)}
.wd-h b{font-family:var(--f-display);font-size:1.25rem;color:var(--ink)}
.wd-h.today b{color:var(--accent)}
.wd-b{padding:8px;display:grid;gap:6px;align-content:start}
.chip{border:0;border-left:3px solid var(--pc);background:var(--pcs);border-radius:6px;padding:5px 7px;text-align:left;cursor:pointer;font-size:.76rem;line-height:1.3;color:var(--ink)}
.chip b{font-family:var(--f-mono);font-weight:500}
.chip.CANCELADO{opacity:.5;text-decoration:line-through}
.closed{color:var(--muted);font-size:.8rem;padding:6px}

/* formulário de agendamento */
.steps{display:grid;gap:14px}
.step{padding:18px;display:grid;gap:14px}
.step-h{display:flex;gap:10px;align-items:baseline}
.step-h .n{font-family:var(--f-mono);font-size:.8rem;color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt small{color:var(--muted)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 0;cursor:pointer;font-family:var(--f-mono);font-size:.85rem}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot:disabled{background:var(--sunk);color:var(--muted);text-decoration:line-through;cursor:not-allowed;border-color:transparent}
.note{font-size:.84rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.note::before{content:"i";flex:none;width:17px;height:17px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:.7rem;font-weight:700;font-style:italic;margin-top:2px}
.summary{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));padding:18px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.total b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}

/* tabelas */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.search{max-width:320px}

/* detalhe */
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.confirm .acts{display:flex;gap:8px;flex-wrap:wrap}
.inline-form{display:grid;gap:14px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.form-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* pagamento */
.formas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.formas .opt{justify-items:center;text-align:center;padding:16px 8px}
.formas .opt b{font-family:var(--f-display);font-size:1.05rem}
.troco{font-size:.95rem;padding:10px 12px;background:var(--sunk);border-radius:8px}

/* relatório */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px 18px}
.filters .field{min-width:150px;flex:1 1 150px;max-width:220px}
.kpis5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.kpis5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.days{display:flex;align-items:flex-end;gap:3px;height:160px;padding:6px 0 0}
.days .d{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.days .d i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.days .d i.zero{background:var(--line)}
.days .d span{font-size:.65rem;color:var(--muted);height:1em;font-variant-numeric:tabular-nums}
.chart-meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.hb{display:grid;gap:12px}
.hb-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.hb-bar{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.hb-bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.share{display:inline-block;height:8px;border-radius:4px;background:var(--pc);vertical-align:middle;margin-right:8px}

/* toast + mapa */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:9px;font-weight:600;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:820px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.overlay{position:fixed;inset:0;background:rgba(15,12,20,.5);z-index:40;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.mapa{width:min(640px,100%);max-height:85vh;overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.mapa-list{display:grid;gap:4px}
.mapa-list button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer}
.mapa-list button:hover{border-color:var(--accent)}
.mapa-list small{color:var(--muted);grid-column:1/-1}
.flow{font-size:.85rem;color:var(--muted);display:grid;gap:4px}
.flow b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>

<div class="proto" role="note"><div class="gut"><span><b>Protótipo navegável</b> · dados fictícios · Leonardo Tricano Costa · SM262208 Projeto de Extensão</span><button type="button" data-act="mapa">Mapa de telas</button></div></div>
<div id="root"></div>
<div id="layer"></div>

<script>
(function(){
// ---------- dados de exemplo ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng=mulberry32(7);
const pick=a=>a[Math.floor(rng()*a.length)];
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const NOW_MIN=13*60+20; // "agora" no protótipo
const ABRE=9*60, FECHA=19*60;

const profs=[
  {id:1,nome:'Rafael',esp:'Cabeleireiro',c:'p1'},
  {id:2,nome:'Luana',esp:'Cabeleireira',c:'p2'},
  {id:3,nome:'Camila',esp:'Manicure',c:'p3'}
];
const servicos=[
  {id:1,nome:'Corte feminino',dur:60,preco:80,profs:[1,2]},
  {id:2,nome:'Corte masculino',dur:30,preco:45,profs:[1]},
  {id:3,nome:'Escova',dur:45,preco:60,profs:[2]},
  {id:4,nome:'Coloração',dur:120,preco:220,profs:[1,2]},
  {id:5,nome:'Hidratação',dur:45,preco:90,profs:[2,3]},
  {id:6,nome:'Manicure',dur:40,preco:35,profs:[3]},
  {id:7,nome:'Pedicure',dur:50,preco:45,profs:[3]},
  {id:8,nome:'Luzes',dur:180,preco:380,profs:[1]}
];
const clientes=[
  ['Ana Paula Ribeiro','(21) 98812-4410','Coloração 6.0 com 20 vol. Prefere o Rafael.'],
  ['Bruno Carvalho','(21) 99734-1022','Corte máquina 2 nas laterais.'],
  ['Carla Menezes','(21) 98450-7781','Couro cabeludo sensível, evitar amônia.'],
  ['Débora Lins','(21) 99120-3345','Escova lisa, sem finalizador.'],
  ['Eduardo Prates','(21) 98007-6612',''],
  ['Fernanda Couto','(21) 99641-2290','Luzes a cada 3 meses.'],
  ['Gabriela Nunes','(21) 98233-9014','Esmalte nude, unha quadrada.'],
  ['Helena Duarte','(21) 99567-1180','Hidratação com máscara de argan.'],
  ['Igor Martins','(21) 98875-4403',''],
  ['Juliana Freitas','(21) 99002-7765','Chega sempre 10 min antes.'],
  ['Kátia Moura','(21) 98311-6528','Pedicure + manicure juntas.'],
  ['Larissa Pinheiro','(21) 99488-0137','Corte em camadas, franja lateral.']
].map((c,i)=>({id:i+1,nome:c[0],tel:c[1],email:c[0].split(' ')[0].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')+'@email.exemplo',obs:c[2]}));

const ags=[];let agSeq=1;
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
const sv=id=>servicos.find(s=>s.id===id), pf=id=>profs.find(p=>p.id===id), cl=id=>clientes.find(c=>c.id===id), ag=id=>ags.find(a=>a.id===id);
function livre(profId,dia,ini,dur,ignore){
  const k=key(dia);
  return !ags.some(a=>a.profId===profId&&key(a.dia)===k&&a.status!=='CANCELADO'&&a.id!==ignore&&ini<a.ini+sv(a.servicoId).dur&&a.ini<ini+dur);
}
function formaAleatoria(){const r=rng();return r<.45?'PIX':r<.85?'CARTAO':'DINHEIRO'}
for(let d=-75;d<=7;d++){
  const dia=addDays(TODAY,d),wd=dia.getDay();
  if(d!==0&&(wd===0||wd===1))continue;
  const alvo=d<0?5+Math.floor(rng()*4):d===0?8:2+Math.floor(rng()*4);
  let n=0;
  for(let t=0;t<30&&n<alvo;t++){
    const s=pick(servicos),p=pick(s.profs),ini=ABRE+30*Math.floor(rng()*18);
    if(ini+s.dur>FECHA||!livre(p,dia,ini,s.dur))continue;
    const a={id:agSeq++,clienteId:1+Math.floor(rng()*clientes.length),profId:p,servicoId:s.id,dia,ini,preco:s.preco,status:'AGENDADO',pagamentos:[]};
    const passou=d<0||(d===0&&ini+s.dur<=NOW_MIN);
    if(passou){
      if(rng()<.08)a.status='CANCELADO';
      else{a.status='CONCLUIDO';a.pagamentos.push({valor:s.preco,forma:formaAleatoria(),dia})}
    }
    ags.push(a);n++;
  }
}

// ---------- utilitários ----------
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const fd=(d,o)=>d.toLocaleDateString('pt-BR',o);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pago=a=>a.pagamentos.reduce((s,p)=>s+p.valor,0);
const saldo=a=>Math.max(0,a.preco-pago(a));
const FORMAS={PIX:'Pix',CARTAO:'Cartão',DINHEIRO:'Dinheiro'};
const ST={AGENDADO:'Agendado',CONCLUIDO:'Concluído',CANCELADO:'Cancelado'};
function pill(a){ if(a.status==='CONCLUIDO'&&saldo(a)>0)return '<span class="pill st-RECEBER">A receber</span>'; return `<span class="pill st-${a.status}">${ST[a.status]}</span>`}
const pcVars=p=>`--pc:var(--${p.c});--pcs:var(--${p.c}-soft)`;
const pchip=p=>`<span class="pc" style="${pcVars(p)}"><i></i>${esc(p.nome)}</span>`;
const rf=(...c)=>c.map(x=>`<span class="rf">${x}</span>`).join(' ');
const ICON={
  home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/>',
  sc:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.2 8.2 20 20M8.2 15.8 20 4"/>',
  chart:'<path d="M4 20V11M10 20V4M16 20v-8M21 20H3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const logo=()=>`<span class="brand">${ic('sc')}Tesoura</span>`;

// ---------- estado ----------
const state={screen:'login',params:{},role:'admin',agView:'dia',agDate:new Date(TODAY),agProf:'todos',
  form:null,rm:null,pg:null,confirm:false,showNovoCli:false,editCli:false,showNovoSrv:false,
  rel:{per:'mes',prof:'todos',de:null,ate:null}};
const PROF_ID=2; // perfil "Profissional" entra como Luana
const scopeOk=a=>state.role==='admin'||a.profId===PROF_ID;

function go(screen,params){
  state.screen=screen;state.params=params||{};state.confirm=false;state.rm=null;state.editCli=false;
  if(screen==='novo'){state.form={clienteId:state.params.clienteId||null,servicoId:null,profId:null,date:key(TODAY),slot:null}}
  if(screen==='pagamento'){const a=ag(state.params.id);state.pg={forma:'PIX',valor:saldo(a)}}
  render();window.scrollTo(0,0);
  try{history.replaceState(null,'',['painel','agenda','novo','clientes','servicos','relatorio'].includes(screen)?'#'+screen:location.pathname+location.search)}catch(e){}
}
let toastT;
function toast(msg){const l=document.getElementById('toast');if(l)l.remove();const t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}

// ---------- telas ----------
function vLogin(){
  const adm=state.role==='admin';
  return `<div class="gut"><div class="login">
  <div class="login-art">
    ${logo()}
    <p class="login-tag">Agenda, clientes e caixa do salão no mesmo lugar.</p>
    <ul class="login-points">
      <li>Agenda por profissional, sem horário duplicado</li>
      <li>Ficha de cada cliente com o histórico de atendimentos</li>
      <li>Pagamentos em Pix, cartão e dinheiro somados no relatório do mês</li>
    </ul>
    <p class="byline">Protótipo de Leonardo Tricano Costa · Projeto de Extensão em Computação Avançada 2026/2</p>
  </div>
  <form class="login-form card" data-sub="login">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h1>Entrar</h1>${rf('RNF01')}</div>
    <div class="field"><span>Entrar como</span>
      <div class="seg"><button type="button" class="${adm?'on':''}" data-act="role" data-role="admin">Administrador</button><button type="button" class="${adm?'':'on'}" data-act="role" data-role="prof">Profissional</button></div>
    </div>
    <label class="field"><span>E-mail</span><input id="l-email" type="email" value="${adm?'dono@salao.exemplo':'luana@salao.exemplo'}"></label>
    <label class="field"><span>Senha</span><input id="l-senha" type="password" value="exemplo"></label>
    <button class="btn primary block" type="submit">Entrar</button>
    <button type="button" class="link" data-act="nd">Esqueci minha senha</button>
    <p class="hint">No protótipo, qualquer e-mail e senha entram.</p>
  </form></div></div>`;
}

function shell(inner){
  const adm=state.role==='admin';
  const items=adm?[['painel','Painel','home'],['agenda','Agenda','cal'],['clientes','Clientes','users'],['servicos','Serviços','sc'],['relatorio','Relatório','chart']]
                 :[['painel','Meu dia','home'],['agenda','Minha agenda','cal']];
  const cur={detalhe:'agenda',pagamento:'agenda',novo:'agenda',cliente:'clientes'}[state.screen]||state.screen;
  const nav=items.map(([s,l,i])=>`<a data-go="${s}" class="${cur===s?'on':''}" href="#${s}">${ic(i)}<span>${l}</span></a>`).join('');
  return `<div class="app">
   <aside class="side">${logo()}
     ${adm?`<button class="btn primary" data-go="novo">${ic('plus')}Novo agendamento</button>`:''}
     <nav class="nav">${nav}</nav>
     <div class="who"><b>${adm?'Administrador':'Luana'}</b><span class="muted">${adm?'Dono do salão':'Profissional · vê só os próprios horários'}</span>
       <button class="link" data-act="logout" style="justify-self:start;margin-top:6px">Sair</button></div>
   </aside>
   <main class="main"><div class="mtop">${logo()}<button class="btn sm ghost" data-act="logout">${ic('out')}Sair</button></div>${inner}</main>
   <nav class="bnav">${nav}</nav>
  </div>`;
}
function head(title,rfs,acts,crumb,sub){
  return `<div class="phead"><div class="t">${crumb?`<button class="crumb" data-go="${crumb[0]}"${crumb[2]?` data-id="${crumb[2]}"`:''}>← ${crumb[1]}</button>`:''}
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1>${title}</h1>${rfs?rf(...rfs):''}</div>${sub?`<p class="muted">${sub}</p>`:''}</div>
    ${acts?`<div class="acts">${acts}</div>`:''}</div>`;
}
function agRow(a){
  const s=sv(a.servicoId),p=pf(a.profId),c=cl(a.clienteId);
  return `<button class="row" data-go="detalhe" data-id="${a.id}"><span class="mono">${hm(a.ini)}</span>
    <span class="who"><b>${esc(c.nome)}</b><small>${esc(s.nome)} · ${esc(p.nome)}</small></span>${pill(a)}</button>`;
}

function vPainel(){
  const hoje=ags.filter(a=>key(a.dia)===key(TODAY)&&scopeOk(a)).sort((x,y)=>x.ini-y.ini);
  const ativos=hoje.filter(a=>a.status!=='CANCELADO');
  const concl=hoje.filter(a=>a.status==='CONCLUIDO');
  const fat=hoje.reduce((s,a)=>s+pago(a),0);
  const prox=ativos.find(a=>a.status==='AGENDADO'&&a.ini>=NOW_MIN);
  const adm=state.role==='admin';
  const dataLonga=fd(TODAY,{weekday:'long',day:'numeric',month:'long'});
  return head(adm?'Painel do dia':'Meu dia',null,adm?`<button class="btn primary" data-go="novo">${ic('plus')}Novo agendamento</button>`:'',null,dataLonga.charAt(0).toUpperCase()+dataLonga.slice(1))+`
  <div class="kpis">
    <div class="card kpi"><span class="label">Atendimentos hoje</span><span class="v">${ativos.length}</span><span class="s">${concl.length} concluídos</span></div>
    <div class="card kpi"><span class="label">Recebido hoje</span><span class="v">${brl(fat)}</span><span class="s">${concl.length} pagamentos</span></div>
    <div class="card kpi"><span class="label">Próximo horário</span><span class="v mono" style="font-size:1.4rem">${prox?hm(prox.ini):'—'}</span><span class="s">${prox?esc(cl(prox.clienteId).nome):'Sem mais horários hoje'}</span></div>
    <div class="card kpi"><span class="label">Cancelados hoje</span><span class="v">${hoje.length-ativos.length}</span><span class="s">horários liberados</span></div>
  </div>
  <div class="two">
    <section class="card"><div class="sec-h"><h2>Agenda de hoje ${rf('RF04')}</h2><button class="btn sm" data-go="agenda">Ver agenda</button></div>
      <div class="list">${hoje.map(agRow).join('')||'<p class="pad muted">Nenhum horário marcado hoje.</p>'}</div></section>
    ${adm?`<section class="card pad" style="display:grid;gap:14px"><h2>Atalhos</h2><div class="quick">
      <button class="btn" data-go="novo">${ic('plus')}Agendar cliente</button>
      <button class="btn" data-act="novoCliAtalho">${ic('users')}Cadastrar cliente</button>
      <button class="btn" data-go="relatorio">${ic('chart')}Relatório do mês</button></div>
      <p class="note">Clique em um horário para concluir o atendimento e registrar o pagamento.</p></section>`
    :`<section class="card pad" style="display:grid;gap:10px"><h2>Seu perfil</h2><p class="muted">Como profissional, você vê e gerencia apenas os seus horários. Cadastros e relatórios ficam com o administrador.</p></section>`}
  </div>`;
}

function vAgenda(){
  const adm=state.role==='admin';
  const profSel=adm?state.agProf:String(PROF_ID);
  const lista=profSel==='todos'?profs:[pf(+profSel)];
  const d=state.agDate;
  const dia=state.agView==='dia';
  const titulo=dia?fd(d,{weekday:'short',day:'2-digit',month:'short'}):(()=>{const s=semana(d);return fd(s[0],{day:'2-digit',month:'short'})+' – '+fd(s[6],{day:'2-digit',month:'short'})})();
  const tool=`<div class="toolbar">
    <div class="seg"><button class="${dia?'on':''}" data-act="agView" data-v="dia">Dia</button><button class="${dia?'':'on'}" data-act="agView" data-v="semana">Semana</button></div>
    <div class="datenav"><button class="btn sm" data-act="agNav" data-d="-1" aria-label="Anterior">‹</button><b>${titulo}</b><button class="btn sm" data-act="agNav" data-d="1" aria-label="Próximo">›</button></div>
    <button class="btn sm" data-act="agHoje">Hoje</button>
    ${adm?`<label class="field" style="grid-auto-flow:column;align-items:center;gap:8px"><span>Profissional</span><select id="ag-prof" data-chg="agProf" class="inp" style="width:auto"><option value="todos">Todos</option>${profs.map(p=>`<option value="${p.id}" ${String(p.id)===profSel?'selected':''}>${p.nome}</option>`).join('')}</select></label>`:''}
  </div>`;
  return head(adm?'Agenda':'Minha agenda',['RF04'],adm?`<button class="btn primary" data-go="novo">${ic('plus')}Novo agendamento</button>`:'')+tool+
    `<div class="legend">${lista.map(pchip).join('')}<span class="muted" style="font-size:.85rem">✓ concluído · riscado = cancelado</span></div>`+
    (dia?gradeDia(d,lista):gradeSemana(d,lista));
}
function semana(d){const x=new Date(d);const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);return [...Array(7)].map((_,i)=>addDays(x,i))}
function gradeDia(d,lista){
  const HP=60;const k=key(d);
  let h='<div class="cal-scroll"><div class="cal" style="--cols:'+lista.length+';--hp:'+HP+'px"><div class="cal-h"></div>'+lista.map(p=>`<div class="cal-h">${pchip(p)}<div class="muted" style="font-weight:400;font-size:.78rem">${p.esp}</div></div>`).join('');
  h+='<div class="ruler">'+[...Array(10)].map((_,i)=>`<span class="mono" style="top:${i*HP}px">${hm(ABRE+i*60)}</span>`).join('')+'</div>';
  const fechado=(d.getDay()===0||d.getDay()===1);
  lista.forEach(p=>{
    h+='<div class="col">';
    if(fechado)h+='<p class="closed">Salão fechado</p>';
    ags.filter(a=>a.profId===p.id&&key(a.dia)===k).forEach(a=>{
      const s=sv(a.servicoId);
      h+=`<button class="ev ${a.status}" style="${pcVars(p)};top:${(a.ini-ABRE)/60*HP+1}px;height:${s.dur/60*HP-3}px" data-go="detalhe" data-id="${a.id}"><b>${hm(a.ini)} ${esc(cl(a.clienteId).nome.split(' ')[0])}</b><span>${esc(s.nome)}</span></button>`;
    });
    if(k===key(TODAY))h+=`<div class="now" style="top:${(NOW_MIN-ABRE)/60*HP}px" title="Agora"></div>`;
    h+='</div>';
  });
  return h+'</div></div>';
}
function gradeSemana(d,lista){
  const ids=lista.map(p=>p.id);
  return '<div class="cal-scroll"><div class="week">'+semana(d).map(x=>{
    const l=ags.filter(a=>ids.includes(a.profId)&&key(a.dia)===key(x)).sort((a,b)=>a.ini-b.ini);
    const fechado=(x.getDay()===0||x.getDay()===1)&&!l.length;
    return `<div class="wd"><div class="wd-h ${key(x)===key(TODAY)?'today':''}"><span>${fd(x,{weekday:'short'})}</span><b>${x.getDate()}</b></div><div class="wd-b">${
      fechado?'<span class="closed">Fechado</span>':l.map(a=>`<button class="chip ${a.status}" style="${pcVars(pf(a.profId))}" data-go="detalhe" data-id="${a.id}"><b>${hm(a.ini)}</b> ${esc(cl(a.clienteId).nome.split(' ')[0])}<br><span class="muted">${esc(sv(a.servicoId).nome)}</span></button>`).join('')||'<span class="closed">Livre</span>'
    }</div></div>`}).join('')+'</div></div>';
}

function slotsHTML(profId,servId,dateK,sel,ignore,act){
  const s=sv(servId),dia=fromKey(dateK),hoje=dateK===key(TODAY);
  if(dia.getDay()===0||dia.getDay()===1)return '<p class="note">O salão não abre aos domingos e segundas. Escolha outra data.</p>';
  let h='<div class="slots">',livres=0;
  for(let t=ABRE;t+s.dur<=FECHA;t+=30){
    const ok=livre(profId,dia,t,s.dur,ignore)&&!(hoje&&t<NOW_MIN);
    if(ok)livres++;
    h+=`<button type="button" class="slot ${sel===t?'on':''}" data-act="${act}" data-t="${t}" ${ok?'':'disabled title="Ocupado"'}>${hm(t)}</button>`;
  }
  return h+'</div>'+(livres?'':'<p class="note">Nenhum horário livre nesta data para esse profissional.</p>');
}

function vNovo(){
  const f=state.form,s=f.servicoId&&sv(f.servicoId),p=f.profId&&pf(f.profId),c=f.clienteId&&cl(f.clienteId);
  const pronto=c&&s&&p&&f.slot!=null;
  const dataTxt=fd(fromKey(f.date),{weekday:'short',day:'2-digit',month:'short'});
  return head('Novo agendamento',['RF03'],null,['agenda','Agenda'])+`
  <div class="two">
   <div class="steps">
    <section class="card step"><div class="step-h"><span class="n">1</span><h2>Cliente</h2></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <label class="field" style="flex:1 1 240px"><span>Quem vai ser atendido?</span><select id="nv-cli" data-chg="nvCli"><option value="">Escolha um cliente…</option>${clientes.map(x=>`<option value="${x.id}" ${x.id===f.clienteId?'selected':''}>${esc(x.nome)} · ${x.tel}</option>`).join('')}</select></label>
        <button class="btn" data-act="novoCliAtalho">${ic('plus')}Cliente novo</button></div>
      ${c&&c.obs?`<p class="note">Ficha: ${esc(c.obs)}</p>`:''}
    </section>
    <section class="card step"><div class="step-h"><span class="n">2</span><h2>Serviço</h2></div>
      <div class="opts">${servicos.map(x=>`<button class="opt ${x.id===f.servicoId?'on':''}" data-act="nvSrv" data-id="${x.id}"><b>${esc(x.nome)}</b><small class="num">${x.dur} min · ${brl(x.preco)}</small></button>`).join('')}</div>
    </section>
    <section class="card step"><div class="step-h"><span class="n">3</span><h2>Profissional</h2></div>

function relRange(){
  const r=state.rel,t=TODAY;
  if(r.per==='mes')return [new Date(t.getFullYear(),t.getMonth(),1),t];
  if(r.per==='passado')return [new Date(t.getFullYear(),t.getMonth()-1,1),new Date(t.getFullYear(),t.getMonth(),0)];
  if(r.per==='30')return [addDays(t,-29),t];
  if(r.per==='7')return [addDays(t,-6),t];
  return [fromKey(r.de),fromKey(r.ate)];
}
function vRelatorio(){
  const r=state.rel;let [de,ate]=relRange();if(ate<de)[de,ate]=[ate,de];
  const inP=a=>a.dia>=de&&a.dia<=ate&&(r.prof==='todos'||a.profId===+r.prof);
  const sel=ags.filter(inP),feitos=sel.filter(a=>a.status==='CONCLUIDO');
  const fat=feitos.reduce((s,a)=>s+pago(a),0);
  const clis=new Set(feitos.map(a=>a.clienteId)).size;
  const canc=sel.filter(a=>a.status==='CANCELADO').length;
  // por dia
  const dias=[];for(let d=new Date(de);d<=ate&&dias.length<93;d=addDays(d,1))dias.push(d);
  const porDia=dias.map(d=>feitos.filter(a=>key(a.dia)===key(d)).reduce((s,a)=>s+pago(a),0));
  const maxD=Math.max(1,...porDia),step=dias.length>40?10:dias.length>16?5:1;
  // por forma
  const pf_={PIX:0,CARTAO:0,DINHEIRO:0};feitos.forEach(a=>a.pagamentos.forEach(p=>pf_[p.forma]+=p.valor));
  // por profissional
  const porProf=profs.map(p=>{const l=feitos.filter(a=>a.profId===p.id);return {p,n:l.length,v:l.reduce((s,a)=>s+pago(a),0)}}).filter(x=>r.prof==='todos'||x.p.id===+r.prof);
  // serviços
  const ps={};feitos.forEach(a=>{ps[a.servicoId]=ps[a.servicoId]||{n:0,v:0};ps[a.servicoId].n++;ps[a.servicoId].v+=pago(a)});
  const top=Object.entries(ps).sort((a,b)=>b[1].v-a[1].v).slice(0,5);
  const per=fd(de,{day:'2-digit',month:'2-digit'})+' a '+fd(ate,{day:'2-digit',month:'2-digit',year:'numeric'});
  return head('Relatório de faturamento',['RF07'],null,null,'Período: '+per+(r.prof==='todos'?' · todos os profissionais':' · '+esc(pf(+r.prof).nome)))+`
  <section class="card filters">
    <label class="field"><span>Período</span><select id="rl-per" data-chg="relPer">${[['mes','Este mês'],['passado','Mês passado'],['30','Últimos 30 dias'],['7','Últimos 7 dias'],['custom','Personalizado']].map(([v,l])=>`<option value="${v}" ${r.per===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="field"><span>De</span><input id="rl-de" type="date" value="${key(de)}" data-chg="relDe"></label>
    <label class="field"><span>Até</span><input id="rl-ate" type="date" value="${key(ate)}" data-chg="relAte"></label>
    <label class="field"><span>Profissional</span><select id="rl-prof" data-chg="relProf"><option value="todos">Todos</option>${profs.map(p=>`<option value="${p.id}" ${String(p.id)===r.prof?'selected':''}>${p.nome}</option>`).join('')}</select></label>
  </section>
  <div class="kpis kpis5">
    <div class="card kpi"><span class="label">Faturamento</span><span class="v">${brl(fat)}</span><span class="s">pagamentos recebidos</span></div>
    <div class="card kpi"><span class="label">Atendimentos</span><span class="v">${feitos.length}</span><span class="s">concluídos</span></div>
    <div class="card kpi"><span class="label">Clientes atendidos</span><span class="v">${clis}</span><span class="s">clientes diferentes</span></div>
    <div class="card kpi"><span class="label">Ticket médio</span><span class="v">${brl(feitos.length?fat/feitos.length:0)}</span><span class="s">por atendimento</span></div>
    <div class="card kpi"><span class="label">Cancelamentos</span><span class="v">${canc}</span><span class="s">${sel.length?Math.round(canc/sel.length*100):0}% dos agendamentos</span></div>
  </div>
  <section class="card pad" style="display:grid;gap:10px"><div class="chart-meta"><h2 style="color:var(--ink)">Faturamento por dia</h2><span class="num">maior dia: ${brl(maxD===1&&!fat?0:maxD)}</span></div>
    <div class="days" role="img" aria-label="Faturamento diário no período">${porDia.map((v,i)=>`<div class="d" title="${fd(dias[i],{day:'2-digit',month:'2-digit'})}: ${brl(v)}"><i class="${v?'':'zero'}" style="height:${Math.max(1,v/maxD*100)}%"></i><span>${i%step===0?dias[i].getDate():''}</span></div>`).join('')}</div></section>
  <div class="two" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <section class="card pad" style="display:grid;gap:14px"><h2>Por forma de pagamento</h2><div class="hb">${Object.entries(pf_).map(([k,v])=>`<div class="hb-row"><span>${FORMAS[k]}</span><div class="hb-bar"><i style="width:${fat?v/fat*100:0}%"></i></div><span class="num">${brl(v)} <span class="muted">${fat?Math.round(v/fat*100):0}%</span></span></div>`).join('')}</div></section>
    <section class="card"><div class="sec-h"><h2>Serviços que mais faturaram</h2></div><div class="tbl-wrap"><table><thead><tr><th>Serviço</th><th class="r">Qtd.</th><th class="r">Valor</th></tr></thead><tbody>${top.map(([id,x])=>`<tr><td>${esc(sv(+id).nome)}</td><td class="r num">${x.n}</td><td class="r num">${brl(x.v)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Sem atendimentos no período.</td></tr>'}</tbody></table></div></section>
  </div>
  <section class="card"><div class="sec-h"><h2>Por profissional</h2></div><div class="tbl-wrap"><table><thead><tr><th>Profissional</th><th class="r">Atendimentos</th><th class="r">Faturamento</th><th>Participação</th></tr></thead><tbody>
  ${porProf.map(x=>`<tr><td>${pchip(x.p)}</td><td class="r num">${x.n}</td><td class="r num">${brl(x.v)}</td><td style="min-width:160px;${pcVars(x.p)}"><span class="share" style="width:${fat?x.v/fat*100:0}px"></span><span class="num muted">${fat?Math.round(x.v/fat*100):0}%</span></td></tr>`).join('')}
  </tbody></table></div></section>`;
}

  const root=document.getElementById('root');
  if(state.screen==='login'){root.innerHTML=vLogin();return}
  if(state.role!=='admin'&&!['painel','agenda','detalhe','pagamento'].includes(state.screen))state.screen='painel';
  root.innerHTML=shell('<div class="wrap">'+VIEWS[state.screen]()+'</div>');
}

// ---------- mapa de telas ----------
const MAPA=[
  ['login','Login','Acesso com perfil de administrador ou profissional','RNF01'],
  ['painel','Painel do dia','Resumo de hoje e atalhos',''],
  ['agenda','Agenda','Visão por dia, por semana e por profissional','RF04'],
  ['novo','Novo agendamento','Cliente → serviço → profissional → horário livre','RF03'],
  ['detalhe','Detalhe do agendamento','Concluir, cancelar ou remarcar','RF08'],
  ['pagamento','Pagamento','Pix, cartão ou dinheiro, com troco','RF05'],
  ['clientes','Clientes','Lista, busca e cadastro','RF01'],
  ['cliente','Ficha do cliente','Dados, preferências e histórico','RF06'],
  ['servicos','Serviços','Preço, duração e quem faz','RF02'],
  ['relatorio','Relatório','Faturamento por período e profissional','RF07']
];
function abrirMapa(){
  document.getElementById('layer').innerHTML=`<div class="overlay" data-act="mapaFechar"><div class="card mapa" role="dialog" aria-modal="true" aria-labelledby="mapa-t" data-stop="1">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 id="mapa-t">Mapa de telas</h2><button class="btn sm" data-act="mapaFechar">Fechar</button></div>
    <div class="flow"><span><b>Fluxo A</b> Login → Painel → Novo agendamento → Agenda</span><span><b>Fluxo B</b> Agenda → Detalhe → Concluir e receber → Pagamento</span><span><b>Fluxo C</b> Painel → Relatório (filtrar por período e profissional)</span></div>
    <div class="mapa-list">${MAPA.map(([s,t,d,r])=>`<button data-act="mapaIr" data-s="${s}"><b>${t}</b><span>${r?rf(r):''}</span><small>${d}</small></button>`).join('')}</div>
    <p class="byline">Leonardo Tricano Costa · Matrícula 2023100301</p></div></div>`;
}

// ---------- ações ----------
const firstAg=()=>ags.find(a=>key(a.dia)===key(TODAY)&&a.status==='AGENDADO')||ags[ags.length-1];
const ACT={
  role:b=>{state.role=b.dataset.role;render()},
  nd:()=>toast('Tela não desenhada neste protótipo'),
  logout:()=>{state.screen='login';render();try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}},
  mapa:abrirMapa,
  mapaFechar:(b,e)=>{if(e.target.closest('[data-stop]')&&!e.target.closest('button[data-act="mapaFechar"]'))return;document.getElementById('layer').innerHTML=''},
  mapaIr:b=>{document.getElementById('layer').innerHTML='';const s=b.dataset.s;
    if(s!=='login'&&state.role!=='admin'&&!['painel','agenda','detalhe','pagamento'].includes(s))state.role='admin';
    if(s==='detalhe'||s==='pagamento')go(s,{id:firstAg().id});else if(s==='cliente')go(s,{id:1});else go(s)},
  agView:b=>{state.agView=b.dataset.v;render()},
  agNav:b=>{state.agDate=addDays(state.agDate,(+b.dataset.d)*(state.agView==='dia'?1:7));render()},
  agHoje:()=>{state.agDate=new Date(TODAY);render()},
  novoCliAtalho:()=>{state.showNovoCli=true;go('clientes');setTimeout(()=>{const i=document.getElementById('nc-nome');if(i)i.focus()},0)},
  nvSrv:b=>{const f=state.form;f.servicoId=+b.dataset.id;const s=sv(f.servicoId);if(!s.profs.includes(f.profId))f.profId=s.profs.length===1?s.profs[0]:null;f.slot=null;render()},
  nvProf:b=>{state.form.profId=+b.dataset.id;state.form.slot=null;render()},
  nvSlot:b=>{state.form.slot=+b.dataset.t;render()},
  nvOk:()=>{const f=state.form,s=sv(f.servicoId);
    const a={id:agSeq++,clienteId:f.clienteId,profId:f.profId,servicoId:f.servicoId,dia:fromKey(f.date),ini:f.slot,preco:s.preco,status:'AGENDADO',pagamentos:[]};
    ags.push(a);state.agDate=fromKey(f.date);state.agView='dia';state.agProf='todos';toast('Agendamento criado');go('agenda')},
  cancelAsk:()=>{state.confirm=true;state.rm=null;render()},
  cancelNo:()=>{state.confirm=false;render()},
  cancelYes:()=>{const a=ag(state.params.id);a.status='CANCELADO';state.confirm=false;toast('Agendamento cancelado. O horário ficou livre.');render()},
  rmOpen:()=>{const a=ag(state.params.id);state.confirm=false;state.rm={date:key(a.dia),slot:null};render()},
  rmClose:()=>{state.rm=null;render()},
  rmSlot:b=>{state.rm.slot=+b.dataset.t;render()},
  rmOk:()=>{const a=ag(state.params.id);a.dia=fromKey(state.rm.date);a.ini=state.rm.slot;state.rm=null;toast('Horário remarcado para '+fd(a.dia,{day:'2-digit',month:'2-digit'})+' às '+hm(a.ini));render()},
  pgForma:b=>{state.pg.forma=b.dataset.f;const v=document.getElementById('pg-valor');if(v)state.pg.valor=+v.value||state.pg.valor;render()},
  toggleCli:()=>{state.showNovoCli=!state.showNovoCli;render()},
  editCli:()=>{state.editCli=!state.editCli;state.confirm=false;render()},
  remCliYes:()=>{const i=clientes.findIndex(c=>c.id===state.params.id);const n=clientes[i].nome;clientes.splice(i,1);toast(n+' removida da lista de clientes');go('clientes')},
  agendarPara:()=>go('novo',{clienteId:state.params.id}),
  toggleSrv:()=>{state.showNovoSrv=!state.showNovoSrv;render()}
};
const CHG={
  agProf:e=>{state.agProf=e.value;render()},
  nvCli:e=>{state.form.clienteId=e.value?+e.value:null;render()},
  nvDate:e=>{if(e.value){state.form.date=e.value;state.form.slot=null;render()}},
  rmDate:e=>{if(e.value){state.rm.date=e.value;state.rm.slot=null;render()}},
  relPer:e=>{state.rel.per=e.value;if(e.value==='custom'){const [d,a]=[addDays(TODAY,-13),TODAY];state.rel.de=state.rel.de||key(d);state.rel.ate=state.rel.ate||key(a)}render()},
  relDe:e=>{if(!e.value)return;const [,a]=relRange();state.rel.ate=key(a);state.rel.de=e.value;state.rel.per='custom';render()},
  relAte:e=>{if(!e.value)return;const [d]=relRange();state.rel.de=key(d);state.rel.ate=e.value;state.rel.per='custom';render()},
  relProf:e=>{state.rel.prof=e.value;render()}
};
const INP={
  busca:e=>{const q=e.value.trim().toLowerCase();document.querySelectorAll('#cli-body tr').forEach(r=>r.hidden=q&&!r.dataset.nome.includes(q))},
  pgValor:e=>{state.pg.valor=+e.value||0;INP.pgTroco(document.getElementById('pg-receb'))},
  pgTroco:e=>{const t=document.getElementById('pg-troco');if(!e||!t)return;const r=+e.value||0,v=state.pg.valor;
    t.textContent=!e.value?'Informe o valor recebido para calcular o troco.':r>=v?'Troco: '+brl(r-v):'Faltam '+brl(v-r)+' para cobrir o valor cobrado.'}
};
const SUB={
  login:()=>go('painel'),
  pagar:()=>{const a=ag(state.params.id),v=Math.round((+document.getElementById('pg-valor').value||0)*100)/100;
    if(v<=0){toast('Informe um valor maior que zero');return}
    a.pagamentos.push({valor:v,forma:state.pg.forma,dia:new Date(TODAY)});a.status='CONCLUIDO';
    toast(saldo(a)>0?'Pagamento registrado. Ainda faltam '+brl(saldo(a)):'Pagamento registrado. Atendimento concluído.');go('detalhe',{id:a.id})},
  novoCli:()=>{const g=id=>document.getElementById(id).value.trim();const id=Math.max(0,...clientes.map(c=>c.id))+1;
    clientes.push({id,nome:g('nc-nome'),tel:g('nc-tel'),email:g('nc-email')||'—',obs:g('nc-obs')});state.showNovoCli=false;toast('Cliente cadastrado');go('cliente',{id})},
  editCli:()=>{const c=cl(state.params.id),g=id=>document.getElementById(id).value.trim();c.nome=g('ec-nome');c.tel=g('ec-tel');c.email=g('ec-email')||'—';c.obs=g('ec-obs');state.editCli=false;toast('Dados atualizados');render()},
  novoSrv:()=>{const g=id=>document.getElementById(id).value.trim();const ps=profs.filter(p=>document.getElementById('ns-p'+p.id).checked).map(p=>p.id);
    if(!ps.length){toast('Marque pelo menos um profissional');return}
    servicos.push({id:Math.max(...servicos.map(s=>s.id))+1,nome:g('ns-nome'),dur:+g('ns-dur'),preco:+g('ns-preco'),profs:ps});state.showNovoSrv=false;toast('Serviço cadastrado');render()}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){if(a.disabled)return;e.preventDefault();ACT[a.dataset.act]&&ACT[a.dataset.act](a,e);return}
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();if(g.dataset.go==='clientes'&&g.closest('.nav,.bnav'))state.showNovoCli=false;go(g.dataset.go,g.dataset.id?{id:+g.dataset.id}:{})}
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t)CHG[t.dataset.chg](t)});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(t)INP[t.dataset.inp](t)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;SUB[f.dataset.sub]&&SUB[f.dataset.sub](f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('layer').innerHTML=''});

// abre direto numa tela se o link tiver #agenda, #relatorio etc.
const h=(location.hash||'').slice(1);
if(['painel','agenda','novo','clientes','servicos','relatorio'].includes(h))go(h);else render();
})();
</script>
</body>
</html>
